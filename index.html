<!doctype html>
<html lang="sw"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piga Bei</title>
<style>
:root{--bg:#fff8e7;--fg:#1d1a12;--card:#fff;--ac:#0b8a4a;--ac2:#f5a300;--bad:#c62828;--mut:#7a705a;--bd:#eadfc2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141209;--fg:#f6efd8;--card:#201c10;--mut:#a89d80;--bd:#3a3220}}
:root[data-theme="dark"]{--bg:#141209;--fg:#f6efd8;--card:#201c10;--mut:#a89d80;--bd:#3a3220}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px}
h1{margin:6px 0 0;font-size:34px;letter-spacing:-1px}h1 span{color:var(--ac2)}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
button,input{font:inherit}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:700;font-size:16px;margin:5px 0;cursor:pointer}
button.o{background:var(--ac2);color:#1d1a12}button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}button.r{background:var(--bad)}
input[type=text]{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--ac)}
.big{font-size:30px;font-weight:800;text-align:center}.em{font-size:56px;text-align:center}
.row{display:flex;gap:8px}.row>*{flex:1}
.sec{background:var(--ac2);color:#1d1a12;border-radius:12px;padding:10px;text-align:center;font-weight:700}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.b{padding:8px 12px;border-radius:14px;margin:4px 0;max-width:85%;background:var(--bd)}.b.me{margin-left:auto;background:var(--ac);color:#fff}
.tag{display:inline-block;background:var(--ac2);color:#1d1a12;border-radius:20px;padding:2px 10px;font-weight:700;font-size:13px}
summary{cursor:pointer;font-weight:700}li{margin:4px 0}
</style></head><body><div id="app"></div>
<script>
const ITEMS=[["📱","Simu ya Tecno",450000],["👟","Viatu vya Kariakoo",60000],["🍌","Mkungu wa ndizi",15000],["🎟️","Tiketi ya tamasha",50000],["🎧","Headphones",35000],["🎒","Begi la chuo",40000],["💻","Laptop used",900000],["👕","Jezi ya Simba/Yanga",35000],["🔋","Power bank",25000],["🪑","Kiti cha chuo",70000],["📚","Vitabu vya chuo",45000],["🕶️","Miwani",20000]];
const RANKS=[[0,"Machinga"],[100,"Muuzaji"],[300,"Mfanyabiashara"],[700,"Dalali"],[1500,"Dalali Mkuu wa Kariakoo"]];
const SAY={buy:["Kaka bei ni hii, sitoi chini.","Mchongo huu, chukua tu!","Hii ni bei ya kirafiki, bro.","Nakupa dili, ila usiringe."],sell:["Nipe bei ya maana boss.","Mfuko wangu ni mwepesi, punguza.","Naweza kuongeza kidogo tu.","Dah, bei yako ni juu sana!"]};
const ls={m:{},get(k){try{return localStorage.getItem(k)}catch(e){return this.m[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){this.m[k]=v}}};
const $=s=>document.querySelector(s),app=$("#app"),fmt=n=>"Tsh "+Math.round(n).toLocaleString("en-US");
let name=ls.get("pb_name")||"",hist=[],chal=null,G=null;
try{hist=JSON.parse(ls.get("pb_h")||"[]")}catch(e){}
try{const m=location.hash.match(/c=([^&]+)/);if(m)chal=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(seed){const r=rng(seed),i=Math.floor(r()*ITEMS.length),j=(i+1+Math.floor(r()*(ITEMS.length-1)))%ITEMS.length,R=(a,b)=>a+r()*(b-a),rd=x=>Math.round(x/500)*500,a=ITEMS[i],b=ITEMS[j];
return[{role:"buy",it:a,M:a[2],me:rd(a[2]*R(1.15,1.5)),ai:rd(a[2]*R(.45,.7))},{role:"sell",it:b,M:b[2],me:rd(b[2]*R(.45,.7)),ai:rd(b[2]*R(1.05,1.4))}]}
function lim(g){return g.role==="buy"?g.ai*1.05:g.ai*.97}
function cur(g,k){const L=lim(g);if(g.role==="buy"){const s=L+(g.M*1.35-L)*.9;return s-(s-L)*(k-1)/4}const s=g.M*.5;return s+(L-s)*(k-1)/4}
function ok(g,o,k){const c=cur(g,k),L=lim(g);return g.role==="buy"?o>=c-(c-L)*.35:o<=c+(L-c)*.35}
const rank=t=>RANKS.filter(r=>t>=r[0]).pop()[1],total=()=>hist.reduce((a,h)=>a+Math.max(0,h.s),0);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function home(){const t=total(),top=[...hist].sort((a,b)=>b.s-a.s).slice(0,5);
app.innerHTML=`<h1>Piga <span>Bei</span></h1><div class="mut">Duwa ya soko. Bluff, subira, faida.</div>
${chal?`<div class="card"><span class="tag">CHANGAMOTO</span><p><b>${esc(chal.n)}</b> amepata <b>${chal.sc}%</b>. Unaweza kumpiga?</p><button class="o" onclick="start(${chal.s},1)">Kubali changamoto ⚔️</button></div>`:""}
<div class="card"><input id="nm" type="text" maxlength="16" placeholder="Jina lako" value="${esc(name)}">
<button onclick="start(Math.floor(Date.now()/864e5))">Duwa ya Leo 🔥</button>
<button class="g" onclick="start(Math.floor(Math.random()*1e9))">Duwa ya Nasibu</button></div>
<div class="card"><b>Cheo chako: <span class="tag">${rank(t)}</span></b><div class="mut">Pointi: ${Math.round(t)}</div>
${top.length?"<p><b>Matokeo yako bora (kwenye simu hii)</b></p>"+top.map((h,i)=>`<div>${i+1}. ${h.s}% <span class="mut">${h.d}</span></div>`).join(""):'<div class="mut">Bado hujacheza.</div>'}</div>
<details class="card"><summary>Jinsi ya kucheza</summary><ol><li>Kila duwa ina raundi 2: kwanza wewe ni <b>mnunuzi</b>, kisha <b>muuzaji</b>.</li><li>Una namba ya siri (thamani au gharama yako). Mpinzani haioni.</li><li>Una zamu 5. Toa bei, kubali bei ya mwenzako, au ondoka.</li><li>☀️ Jua linazama: kila zamu faida yako inapungua 7%.</li><li>Ukiondoka, mpinzani anaweza kukuita kwa bei nzuri zaidi, au dili likafa. Ni bluff!</li><li>Alama = faida uliyopata ukilinganisha na faida kubwa iliyowezekana.</li></ol></details>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function start(seed,isC){const n=$("#nm");if(n){name=n.value.trim()||"Mchezaji";ls.set("pb_name",name)}name=name||"Mchezaji";
G={seed,isC,rounds:mk(seed),ri:0,k:1,res:[],log:[],left:false};round()}
function round(){const g=G.rounds[G.ri],k=G.k,buy=g.role==="buy",c=Math.round(cur(g,k)/500)*500,m=1-.07*(k-1),
mn=Math.round(g.M*.3/500)*500,mx=Math.round(g.M*1.7/500)*500,def=Math.min(mx,Math.max(mn,Math.round((buy?c*.8:c*1.2)/500)*500));
app.innerHTML=`<div class="mut">Raundi ${G.ri+1}/2 · zamu ${k}/5 · wewe ni <b>${buy?"MNUNUZI":"MUUZAJI"}</b></div>
<div class="card"><div class="em">${g.it[0]}</div><div class="big" style="font-size:20px">${g.it[1]}</div><div class="mut" style="text-align:center">Bei ya sokoni takriban ${fmt(g.M)}</div>
<div class="sec" style="margin-top:10px">🤫 ${buy?"Thamani yako (siri)":"Gharama yako (siri)"}: ${fmt(g.me)}</div></div>
<div class="card"><div class="mut">☀️ Jua linazama (faida iliyobaki: ${Math.round(m*100)}%)</div><div class="bar"><i style="width:${m*100}%"></i></div>
<div>${G.log.map(l=>`<div class="b ${l[0]}">${l[1]}</div>`).join("")}</div>
<div class="b">${buy?"Muuzaji anataka":"Mnunuzi anatoa"}: <b>${fmt(c)}</b></div></div>
<div class="card"><div class="mut" style="text-align:center">${buy?"Bei yako ya kutoa":"Bei yako ya kuomba"}</div><div class="big" id="ov">${fmt(def)}</div>
<input id="sl" type="range" min="${mn}" max="${mx}" step="500" value="${def}" oninput="upd()"><div class="mut" style="text-align:center" id="pv"></div>
<button onclick="offer()">Toa bei 💬</button><div class="row"><button class="o" onclick="fin(${c},${k})">Kubali ${fmt(c)}</button>${g.left?"":'<button class="g" onclick="leave()">Ondoka 🚶</button>'}</div></div>`;upd()}
function upd(){const g=G.rounds[G.ri],o=+$("#sl").value,p=g.role==="buy"?g.me-o:o-g.me;$("#ov").textContent=fmt(o);$("#pv").innerHTML=`Faida yako kwa bei hii: <b style="color:${p<0?"var(--bad)":"var(--ac)"}">${p<0?"-":""}${fmt(Math.abs(p))}</b>`}
function offer(){const g=G.rounds[G.ri],k=G.k,o=+$("#sl").value;G.log=G.log.slice(-4);G.log.push(["me",fmt(o)]);
if(ok(g,o,k))return fin(o,k);if(k===5)return fin(null,k);G.k++;G.log.push(["",pick(SAY[g.role])]);round()}
function leave(){const g=G.rounds[G.ri],k=G.k,L=lim(g),c=cur(g,k);G.rounds[G.ri].left=true;
if(Math.random()<.25+.5*(k-1)/4){const p=g.role==="buy"?L+(c-L)*.3:L-(L-c)*.3;G.log.push(["","Subiri! Rudi, tupatane! 🤝"]);return fin(Math.round(p/500)*500,k)}
G.log.push(["","Sawa, kwaheri. Hakuna dili. 👋"]);fin(null,k)}
function fin(price,k){const g=G.rounds[G.ri],buy=g.role==="buy",m=1-.07*(k-1),sur=buy?g.me-g.ai:g.ai-g.me;let pr=0,sc=0;
if(price!=null){pr=buy?g.me-price:price-g.me;sc=Math.max(-30,Math.round(pr*m/sur*100))}
G.res.push({g,price,pr,sc,k});G.log=[];G.k=1;
const v=price==null?"Mliachana bila dili. 🤷":sc>=45?"Umempiga bei! 🔥":sc>=15?"Biashara ya kawaida. 👍":"Umepigwa Bei! 😭";
app.innerHTML=`<div class="card"><div class="em">${g.it[0]}</div><div class="big">${v}</div>
${price!=null?`<p>Dili ya <b>${fmt(price)}</b> (zamu ${k}). Faida: <b>${pr<0?"-":""}${fmt(Math.abs(pr))}</b> · Alama: <b>${sc}%</b></p>`:""}
<p class="mut">Siri zilifichuka: ${buy?"Muuzaji alikuwa tayari kuuza hadi":"Mnunuzi alikuwa tayari kulipa hadi"} <b>${fmt(g.role==="buy"?lim(g):lim(g)/.97*.97)}</b>. Thamani/gharama yako ilikuwa ${fmt(g.me)}.</p>
<button onclick="next()">${G.ri===0?"Raundi ya 2 ➜":"Ona matokeo ➜"}</button></div>`}
function next(){if(G.ri===0){G.ri=1;G.k=1;G.log=[];return round()}done()}
function done(){const sc=Math.round((G.res[0].sc+G.res[1].sc)/2),d=new Date().toLocaleDateString("sw-TZ");hist.push({s:sc,d});hist=hist.slice(-50);ls.set("pb_h",JSON.stringify(hist));
const link=location.href.split("#")[0]+"#c="+btoa(unescape(encodeURIComponent(JSON.stringify({s:G.seed,n:name,sc})))),
txt=`${sc>=45?"Nimempiga bei!":"Nimepata"} ${sc}% kwenye Piga Bei 🛒 Nipige kama unaweza 👉 ${link}`,t=total();
let cmp="";if(G.isC&&chal)cmp=`<div class="sec">${sc>chal.sc?`Umemshinda ${esc(chal.n)}! 🏆 (${sc}% dhidi ya ${chal.sc}%)`:sc===chal.sc?"Sare na "+esc(chal.n)+"!":`${esc(chal.n)} amekushinda (${chal.sc}% dhidi ya ${sc}%). Jaribu tena!`}</div>`;
window._t=txt;
app.innerHTML=`<div class="card"><div class="mut" style="text-align:center">Alama ya duwa</div><div class="big" style="font-size:60px">${sc}%</div>${cmp}
<p style="text-align:center">${G.res.map(r=>r.g.it[0]+" "+r.sc+"%").join(" · ")}</p><p style="text-align:center">Cheo: <span class="tag">${rank(t)}</span> · Pointi ${Math.round(t)}</p></div>
<div class="card"><b>Mpe rafiki changamoto hii hii:</b><p class="mut">Atacheza bidhaa zile zile, ndipo mshindane kwa haki.</p>
<a href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener"><button>Tuma WhatsApp 💬</button></a>
<button class="o" id="cp" onclick="cp()">Nakili ujumbe</button><button class="g" onclick="home()">Rudi mwanzo</button></div>`}
function cp(){try{navigator.clipboard.writeText(window._t).then(()=>$("#cp").textContent="Imenakiliwa ✅")}catch(e){prompt("Nakili:",window._t)}}
home();
</script></body></html>
